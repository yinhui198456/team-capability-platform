services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tcp
      POSTGRES_USER: tcp
      POSTGRES_PASSWORD: tcp_dev_only
    ports:
      - "127.0.0.1:15463:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcp -d tcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://tcp:tcp_dev_only@postgres:5432/tcp
      CORS_ORIGINS: http://localhost:5173,http://localhost:18081
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:80"

volumes:
  postgres-data:
