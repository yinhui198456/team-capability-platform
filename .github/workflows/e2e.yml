name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Update Playwright visual baselines and commit them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose stack
        run: |
          docker compose down -v
          docker compose up -d --build

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:18001/ready; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          docker compose logs backend
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run E2E tests
        if: github.event.inputs.update-snapshots != 'true'
        working-directory: frontend
        run: PLAYWRIGHT_NO_WEBSERVER=1 npm run test:e2e

      - name: Update visual baselines
        if: github.event.inputs.update-snapshots == 'true'
        working-directory: frontend
        run: PLAYWRIGHT_NO_WEBSERVER=1 npm run test:e2e:update-snapshots

      - name: Commit updated baselines
        if: github.event.inputs.update-snapshots == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update Playwright visual baselines'
          file_pattern: 'frontend/tests/e2e/**/*.spec.ts-snapshots/*'

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
