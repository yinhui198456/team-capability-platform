name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: tcp-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_NO_WEBSERVER: "1"
      TCP_E2E_ISOLATED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate per-run demo password
        run: |
          demo_pwd="$(openssl rand -hex 24)"
          # Static guard: a repository-fixed demo password must never return.
          # Refuse short values so future edits cannot restore a fixed
          # credential. The compose stack is isolated per run
          # (COMPOSE_PROJECT_NAME) and torn down afterwards.
          if [[ ${#demo_pwd} -lt 32 ]]; then
            echo "Generated demo password too short; refusing to continue" >&2
            exit 1
          fi
          echo "::add-mask::$demo_pwd"
          echo "DEMO_SEED_PASSWORD=$demo_pwd" >> "$GITHUB_ENV"

      - name: Assert demo password is per-run generated
        run: |
          # Guards against a future edit restoring a fixed value: the demo
          # password must be a per-run generated value, never hardcoded.
          if [[ ${#DEMO_SEED_PASSWORD} -lt 32 ]]; then
            echo "DEMO_SEED_PASSWORD is not per-run generated; hardcoded values are forbidden" >&2
            exit 1
          fi

      - name: Start Docker Compose stack
        run: |
          docker compose down -v --remove-orphans
          if docker compose up -d --build; then
            exit 0
          else
            status=$?
            echo "Docker Compose startup failed; container status follows."
            docker compose ps -a || true
            echo "Backend logs (last 200 lines):"
            docker compose logs --no-color --tail=200 backend || true
            exit "$status"
          fi

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:18001/ready; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          docker compose logs backend
          exit 1

      - name: Wait for frontend reachability
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:18081/ > /dev/null; then
              echo "Frontend is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become reachable in time"
          docker compose logs frontend
          exit 1

      - name: Smoke test the running stack
        run: |
          set -e
          echo "Checking backend health..."
          curl -sf http://localhost:18001/health
          echo ""
          echo "Checking backend readiness..."
          curl -sf http://localhost:18001/ready
          echo ""
          echo "Checking public catalog API..."
          curl -sf http://localhost:18001/api/capability-model > /dev/null
          echo ""
          echo "Checking frontend is reachable..."
          curl -sf http://localhost:18081/ > /dev/null
          echo ""
          echo "Smoke tests passed"

      - name: Run E2E tests in Playwright container
        run: |
          docker run --rm --network host \
            -v "$PWD/frontend:/app" \
            -w /app \
            -e PLAYWRIGHT_NO_WEBSERVER=1 \
            -e TCP_E2E_ISOLATED=1 \
            -e TCP_E2E_DEMO_PASSWORD="$DEMO_SEED_PASSWORD" \
            mcr.microsoft.com/playwright:v1.61.1-jammy \
            bash -c "apt-get update && apt-get install -y fonts-noto-cjk && (npm ci || npm ci) && npx playwright test"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
