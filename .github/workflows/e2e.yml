name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: tcp-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_NO_WEBSERVER: "1"
      TCP_E2E_ISOLATED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose stack
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --build

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:18001/ready; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          docker compose logs backend
          exit 1

      - name: Run E2E tests in Playwright container
        run: |
          docker run --rm --network host \
            -v "$PWD/frontend:/app" \
            -w /app \
            -e PLAYWRIGHT_NO_WEBSERVER=1 \
            mcr.microsoft.com/playwright:v1.61.1-jammy \
            bash -c "apt-get update && apt-get install -y fonts-noto-cjk && npm ci && npx playwright test"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
