    <title>TCP 页面三版本原型</title>
    <script>
      (() => {
        const isSelectedM02 = () => {
          const query = new URLSearchParams(location.search)
          return (
            query.get('collection') === 'selected' &&
            query.get('page') === 'M02'
          )
        }
        if (isSelectedM02()) {
          location.replace('./pages/m02-selected.html')
          return
        }
        const replaceState = history.replaceState
        history.replaceState = function (...args) {
          replaceState.apply(this, args)
          if (isSelectedM02()) location.replace('./pages/m02-selected.html')
        }
      })()
    </script>
